name: C# CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: csharp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test C# (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "csharp/IPCE.slnx"

      - name: Build
        run: dotnet build "csharp/IPCE.slnx" -c Release --no-restore

      - name: Test
        run: dotnet test "csharp/IPCE.slnx" -c Release --no-build --no-restore
